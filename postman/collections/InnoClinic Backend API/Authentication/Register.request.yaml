$kind: http-request
name: Register
method: POST
url: '{{identityBaseUrl}}/Authentication/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "password": "Password123!",
      "hardCodedRole": "Patient"
    }
auth:
  type: noauth
  credentials: []
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 200) {
          const response = pm.response.json();
          if (response.token) {
              pm.collectionVariables.set("accessToken", response.token);
          }
      }
