$kind: http-request
name: Verify Email
method: GET
url: '{{identityBaseUrl}}/Authentication/verify-email'
order: 3000
queryParams:
  - key: accountId
    value: '{{accountId}}'
    description: The account ID to verify
  - key: token
    value: '{{verificationToken}}'
    description: Email verification token
auth:
  type: noauth
  credentials: []
