$kind: http-request
name: Update Office
method: PUT
url: '{{clinicManagementBaseUrl}}/offices/{{officeId}}'
order: 2000
pathVariables:
  - key: officeId
    value: ''
    description: The office ID to update
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "id": "{{officeId}}",
      "address": "123 Medical Center Drive",
      "photoUrl": "https://example.com/office-photo.jpg",
      "registryPhoneNumber": "+1-555-0100",
      "isActive": true
    }
