$kind: http-request
name: Create category
url: https://{{gateway-host}}/clinic-management/service-categories
method: POST
body:
  type: json
  content: |-
    {
        "categoryName": "Category {{catiterator}}",
        "timeSlotSize": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Create category successful", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Category Id saved", function () {
          var jsonData = pm.response.json();
          var categoryId = jsonData;
          var iterator = pm.environment.get("catiterator");

          console.log("Создали категорию с id", categoryId);

          console.log("А итератор", iterator);

          pm.environment.set("catiterator", iterator + 1);

          let number = 1;
          console.log("env: iterator = ", pm.environment.get("catiterator"));
          console.log("Дошли");
          pm.environment.set("categoryId", categoryId);
          console.log("Дошли2");
      });
    language: text/javascript
order: 5000
