$kind: http-request
name: Create category
url: https://{{gateway-host}}/clinic-management/service-categories
method: POST
body:
  type: json
  content: |-
    {
        "categoryName" : "Category 123",
        "timeSlotSize" : 1
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Create category successful", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Category Id saved", function () {
          var jsonData = pm.response.json();
          var categoryId = jsonData;

          pm.environment.set("categoryId", categoryId);
      });
    language: text/javascript
order: 5000
