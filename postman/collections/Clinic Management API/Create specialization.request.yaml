$kind: http-request
name: Create specialization
url: https://{{gateway-host}}/clinic-management/specializations
method: POST
body:
  type: json
  content: |-
    {
        "specializationName" : "Specialization 2",
        "isActive" : true
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Create category successful", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Category Id saved", function () {
          var jsonData = pm.response.json();
          var specializationId = jsonData;

          pm.environment.set("specializationId", specializationId);
      });
    language: text/javascript
order: 6000
