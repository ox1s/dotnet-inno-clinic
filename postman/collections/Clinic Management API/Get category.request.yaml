$kind: http-request
name: Get category
url: https://{{gateway-host}}/clinic-management/categories/
method: GET
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"get category successful\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Category Id saved\", function () {\r

      \    var jsonData = pm.response.json();\r

      \ \r

      \    console.info(\"Привет\");\r

      \    var categoryId = jsonData[0].id;\r

      \    pm.environment.set(\"categoryId\", categoryId);\r

      });"
    language: text/javascript
