$kind: http-request
name: Create Doctor Profile
url: https://{{gateway-host}}/profile/receptionists/doctors
method: POST
body:
  type: json
  content: |-
    {
      "accountId": "{{$guid}}",
      "firstName": "Григорий",
      "lastName": "Григорьев",
      "middleName": "Григорьевич",
      "dateOfBirth": "2000-03-06",
      "email": "doctor{{$guid}}@innoclinic.com",
      "specializationId": "{{specializationId}}",
      "officeId": "{{officeId}}",
      "careerStartYear": 2000,
      "status": "At work"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 1000
