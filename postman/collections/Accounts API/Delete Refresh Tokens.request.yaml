$kind: http-request
name: Delete Refresh Tokens
url: https://{{gateway-host}}/identity/authentication/accounts/{{userId}}/refresh-tokens
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 204 or 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });
    language: text/javascript
order: 6000
